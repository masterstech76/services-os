name: ServicePro OS CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
          cd admin_web && npm install

      - name: Verify environment & SQL migrations
        run: npm run verify-env

      - name: Validate Flutter mobile codebase
        run: npm run validate-mobile

      - name: TypeScript typecheck & production build
        run: npm run build

      - name: Linter check
        run: npm run lint
