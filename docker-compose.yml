# ==============================================================================
# ServicePro OS — Production Turnkey Docker Compose
# Complete Enterprise Architecture: Fastify API + React Web + PostgreSQL 16/PostGIS + Redis
# Target Commercial Turnkey Deployment ($20,000–$60,000 Acquisition Asset)
# ==============================================================================

version: '3.8'

services:
  # 1. PostgreSQL 16 with PostGIS Spatial Extension
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: servicepro_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-servicepro}
      POSTGRES_USER: ${POSTGRES_USER:-servicepro_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeSecurePassword2026!}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-servicepro_admin} -d ${POSTGRES_DB:-servicepro}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - servicepro_network

  # 2. Redis 7 In-Memory Cache & Ephemeral Dispatch State
  redis:
    image: redis:7-alpine
    container_name: servicepro_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - servicepro_network

  # 3. Fastify + TypeScript Core Backend Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: servicepro_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-servicepro_admin}:${POSTGRES_PASSWORD:-ChangeMeSecurePassword2026!}@postgres:5432/${POSTGRES_DB:-servicepro}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-ChangeMe_ProductionJwtSecretKey_Min32Chars!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-ChangeMe_ProductionRefreshSecretKey_Min32Chars!}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-ServiceProBootstrapToken2026!}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:80,http://localhost:5173}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - servicepro_network

  # 4. React 19 + Vite Admin & Staff Web Control Portal
  frontend:
    build:
      context: ./admin_web
      dockerfile: Dockerfile
    container_name: servicepro_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - servicepro_network

volumes:
  postgres_data:
    name: servicepro_postgres_data
  redis_data:
    name: servicepro_redis_data

networks:
  servicepro_network:
    name: servicepro_network
    driver: bridge
